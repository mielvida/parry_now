<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>새 게임</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f2; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; }
  #help { position: fixed; left: 14px; bottom: 14px; padding: 8px 14px; border-radius: 14px; background: #ffffffdd; color: #333; border: 2px solid #111; font: 700 14px/1.5 'Malgun Gothic', sans-serif;  pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help">← → (A D) 이동 · Shift 달리기 · Space / ↑ / W 점프</div>
<script>
// ===== 새 게임 (1단계, 2D): 평범한 아이 1명 + 땅. 옆에서 보는 횡스크롤 =====
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 1, SC0 = 1;   // SC: 세계 한 칸(px) 배율
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; SC0 = Math.max(1.2, Math.min(W / 640, H / 360)) * 1.35; SC = SC0; }
addEventListener('resize', resize); resize();

// ---- 입력 ----
const keys = {}; addEventListener('keydown', (e) => { keys[e.code] = true; if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !e.repeat) P.jumpBuf = 0.12; });
addEventListener('keyup', (e) => { keys[e.code] = false; }); addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---- 세계: 땅 높이는 y=0, 위쪽이 음수 (캔버스 좌표) ----
const GROUND_Y = 0;
const P = { ax: 0, la: 0, lv: 0, x: 0, y: 0, vx: 0, vy: 0, dir: 1, ground: true, coyote: 0, jumpBuf: 0, gait: 0, squash: 0, blink: 0, nextBlink: 2.2, t: 0, landT: 0 };
const cam = { x: 0 };

// ---- 그리기 도구 ----
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); };
function limb(x0, y0, x1, y1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }

// ===== 흑백 낙서 스타일 =====
const INK = '#111', PAPER = '#f4f4f2', GAIT_K = 0.09, STRIDE = 1 / GAIT_K;
const wob = (x, k) => Math.sin(x * 0.071 + k) * 1.3 + Math.sin(x * 0.19 + k * 2) * 0.8;   // 손으로 그린 듯한 떨림
function sketchLine(x0, y0, x1, y1, w, col, ox) { ox = ox || 0; g.strokeStyle = col || INK; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); const n = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 14)); for (let k = 0; k <= n; k++) { const u = k / n, px = x0 + (x1 - x0) * u, py = y0 + (y1 - y0) * u + wob(px + ox, 1.7); k ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke(); }

// 캐릭터: 네모 몸통 + 발 2개 (검은 테두리)
function drawKid(x, y, s) {
  const sp = Math.abs(P.vx), air = !P.ground, mv = Math.min(1, sp / 40), hop = air ? 0 : Math.abs(Math.sin(P.gait)) * Math.min(1, sp / 90) * 2.5, idle = Math.sin(P.t * 2.4) * (sp < 10 ? 1 : 0);
  const st = air ? Math.max(-0.18, Math.min(0.2, -P.vy / 2600)) : 0, sy = 1 - P.squash * 0.22 + st + idle * 0.02, sx = 1 + P.squash * 0.2 - st * 0.7 - idle * 0.014, lean = Math.max(-1, Math.min(1, P.vx / 300)) * 0.17 - Math.max(-1, Math.min(1, P.ax / 700)) * 0.12 + WIND.g * 0.05;
  g.save(); g.translate(x, y); g.scale(s, s); g.lineWidth = 2; g.lineJoin = 'round'; g.strokeStyle = INK; g.fillStyle = '#fff';
  const dirv = P.vx < 0 ? -1 : 1, foot = (fx, ph) => { const c = Math.cos(ph), off = air ? 0 : -STRIDE * Math.sin(ph) * dirv * mv, lift = air ? 5 : Math.max(0, -c) * 8 * mv; g.beginPath(); rr(fx + off - 6.5, -9 - lift, 13, 8.5, 3); g.fill(); g.stroke(); };
  foot(-9, P.gait); foot(9, P.gait + Math.PI);
  g.translate(0, -hop - 9); g.rotate(lean); g.scale(sx, sy);
  g.beginPath(); rr(-20, -38, 40, 38, 4); g.fill(); g.stroke();
  g.restore();
}

// ---- 배경: 대충 그린 흑백 낙서 (구름 · 산 · 나무), 멀수록 천천히 움직인다 ----
function scribbleCloud(x, y, w) { g.strokeStyle = '#9a9a9a'; g.fillStyle = '#fff'; g.lineWidth = 2.2; g.lineJoin = 'round'; g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x - w * 0.1, y - w * 0.22, x + w * 0.2, y - w * 0.34, x + w * 0.3, y - w * 0.16); g.bezierCurveTo(x + w * 0.4, y - w * 0.4, x + w * 0.75, y - w * 0.3, x + w * 0.72, y - w * 0.08); g.bezierCurveTo(x + w * 0.95, y - w * 0.04, x + w * 0.95, y + w * 0.12, x + w * 0.72, y + w * 0.12); g.lineTo(x + w * 0.08, y + w * 0.12); g.bezierCurveTo(x - w * 0.12, y + w * 0.1, x - w * 0.12, y - w * 0.02, x, y); g.closePath(); g.fill(); g.stroke(); }
function mountains(par, base, amp, fill, stroke, per, off) {
  const camX = cam.x * par; g.fillStyle = fill; g.strokeStyle = stroke; g.lineWidth = 2.2; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-20, base + 40);
  for (let sx = -20; sx <= W + 20; sx += 22) { const wx = (sx + camX) / SC, tri = Math.abs(((wx / per + off) % 1 + 1) % 1 - 0.5) * 2, hgt = (0.25 + 0.75 * (1 - tri)) * amp * (0.7 + 0.3 * Math.sin(wx / (per * 2.3) + off * 3)); g.lineTo(sx, base - hgt * SC + wob(wx, off) * 1.5); }
  g.lineTo(W + 20, base + 40); g.closePath(); g.fill(); g.stroke();
}
function scribbleTree(x, base, h, col) { const sw = 0; g.strokeStyle = col; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x + sw * 0.2, base - h * 0.3, x + sw, base - h * 0.55); g.stroke(); g.strokeStyle = col; g.lineWidth = 2.4; g.fillStyle = '#fff'; g.beginPath(); for (let a = 0; a <= 6.4; a += 0.4) { const rx = x + sw * 1.4 + Math.cos(a) * h * 0.3 + wob(a * 20, 3) * 0.8, ry = base - h * 0.7 + Math.sin(a) * h * 0.27; a ? g.lineTo(rx, ry) : g.moveTo(rx, ry); } g.closePath(); g.fill(); g.stroke(); }
const clouds = Array.from({ length: 8 }, (_, i) => ({ x: i * 420 + (i * 131) % 200, y: 70 + (i * 61) % 120, w: 90 + (i * 47) % 70 }));
const trees = Array.from({ length: 28 }, (_, i) => ({ x: i * 190 + (i * 73) % 90, h: 50 + (i * 37) % 36 }));
function render() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = PAPER; g.fillRect(0, 0, W, H); const gy = Math.round(H * 0.76);
  // 해 (연필로 그린 동그라미)
  g.strokeStyle = '#8a8a8a'; g.lineWidth = 2.2; g.fillStyle = '#fff'; g.beginPath(); for (let a = 0; a <= 6.5; a += 0.2) { const rx = W * 0.84 + Math.cos(a) * 34 + wob(a * 30, 5) * 0.7, ry = H * 0.17 + Math.sin(a) * 34 + wob(a * 30, 6) * 0.7; a ? g.lineTo(rx, ry) : g.moveTo(rx, ry); } g.closePath(); g.fill(); g.stroke();
  clouds.forEach((c) => { const wx = c.x % 1100 - 60; scribbleCloud(wx * SC / 1.35, c.y * SC / 1.35, c.w * SC / 1.35); });
  mountains(0, gy - 18 * SC / 1.35, 150, '#e2e2e0', '#8a8a8a', 520, 0.3); mountains(0, gy - 2, 95, '#cfcfcd', '#6a6a6a', 330, 1.4);
  trees.slice(0, 12).forEach((tr, i) => { const wx = (i + 0.5) * W / 12 + ((i * 73) % 50 - 25); scribbleTree(wx, gy, tr.h * SC / 1.35, '#555'); });
  // 땅: 검은 선 하나
  g.fillStyle = '#e9e9e7'; g.fillRect(0, gy, W, H - gy); sketchLine(-10, gy, W + 10, gy, 4, INK, cam.x / SC);
  { const gap = 64 * SC / 1.35, o = -(((cam.x % gap) + gap) % gap); for (let sx = o - gap; sx < W + gap; sx += gap) { const wi = Math.round((sx + cam.x) / gap), r1 = ((wi * 2654435761) >>> 0) % 100; sketchLine(sx + 14, gy + 14 * SC / 1.35 + (r1 % 3) * 9, sx + 14 + (10 + r1 % 22) * SC / 1.35, gy + 14 * SC / 1.35 + (r1 % 3) * 9, 2, '#9a9a9a', wi * 7); if (r1 % 3 === 0) { g.fillStyle = '#c9c9c7'; g.beginPath(); g.ellipse(sx + 40, gy + 46 * SC / 1.35, 5 * SC / 1.35, 3 * SC / 1.35, 0, 0, 7); g.fill(); } } }
  drawFx(gy); drawKid(P.x * SC - cam.x, gy + P.y * SC, SC * 0.7);
}
// ---- 바람 · 달릴 때 효과 ----
const WIND = { g: 0, gt: 0 }, FX = [];
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
let runK = 0, prevCam = 0;
function spawnFx(dt, gy) {
  const sp = Math.abs(P.vx), dir = Math.sign(P.vx) || 1;
  // 바람 세기: 세졌다 약해졌다
  WIND.gt = clampN(0.18 + Math.sin(P.t * 0.37) * 0.5 + Math.sin(P.t * 0.91 + 1) * 0.3, 0, 1); WIND.g += (WIND.gt - WIND.g) * Math.min(1, dt * 1.5);
  // 바람 줄 · 날리는 잎
  if (Math.random() < dt * (0.8 + WIND.g * 5)) FX.push({ k: 'wind', x: -60, y: H * (0.1 + Math.random() * 0.6), v: 150 + WIND.g * 330 + Math.random() * 90, len: 70 + Math.random() * 110, a: 6 + Math.random() * 8, ph: Math.random() * 6, life: 0, max: 2.2 + Math.random() });
  if (WIND.g > 0.35 && Math.random() < dt * WIND.g * 5) FX.push({ k: 'leaf', x: -20, y: H * (0.25 + Math.random() * 0.5), vx: 140 + WIND.g * 300, vy: 0, r: Math.random() * 6, life: 0, max: 5 });
  // 빨리 달리면: 속도선 · 먼지
  if (sp > 235 && P.ground !== undefined) { const rate = (sp - 220) / 110 * 40; if (Math.random() < dt * rate) FX.push({ k: 'speed', x: dir > 0 ? W + 20 : -20, y: gy - Math.random() * H * 0.34, v: -dir * (sp * 1.5 + Math.random() * 200), len: 60 + Math.random() * 120 + sp * 0.2, life: 0, max: 0.55 }); }
  if (false) FX.push({ k: 'puff', wx: P.x - dir * 8, y: 2, vx: -dir * 18 - Math.random() * 20, vy: -26 - Math.random() * 20, r: 3 + Math.random() * 3, life: 0, max: 0.5 + Math.random() * 0.2 });
  if (P.landFx && false) { for (let i = 0; i < 6; i++) FX.push({ k: 'puff', wx: P.x + (i - 2.5) * 5, y: 2, vx: (i - 2.5) * 22, vy: -22 - Math.random() * 14, r: 3 + Math.random() * 3, life: 0, max: 0.5 }); P.landFx = 0; }
  const dcam = cam.x - prevCam; prevCam = cam.x;
  for (let i = FX.length - 1; i >= 0; i--) { const f = FX[i]; f.life += dt; if (f.life >= f.max) { FX.splice(i, 1); continue; } if (f.k === 'puff') { f.wx += f.vx * dt; f.y += f.vy * dt; f.vy *= 0.97; f.vx *= 0.97; } else if (f.k === 'leaf') { f.vy += (Math.sin(f.life * 4 + f.r) * 60 - f.vy) * dt * 2; f.x += f.vx * dt - dcam; f.y += f.vy * dt; f.r += dt * 4; } else { f.x += (f.v || 0) * dt - dcam; } }
}
function drawFx(gy) {
  for (const f of FX) {
    const u = f.life / f.max, al = Math.sin(u * Math.PI);
    if (f.k === 'wind') { g.strokeStyle = 'rgba(120,120,120,' + (0.55 * al) + ')'; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath(); for (let k = 0; k <= 16; k++) { const q = k / 16, px = f.x + q * f.len, py = f.y + Math.sin(q * 6 + f.ph + f.life * 2) * f.a * (1 - Math.abs(q - 0.5) * 1.2); k ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke(); g.beginPath(); g.arc(f.x + f.len, f.y + Math.sin(6 + f.ph + f.life * 2) * 0, 6, -2.4, 1.2); g.stroke(); }
    else if (f.k === 'leaf') { g.save(); g.translate(f.x, f.y); g.rotate(f.r); g.strokeStyle = 'rgba(60,60,60,' + al + ')'; g.fillStyle = 'rgba(255,255,255,' + al + ')'; g.lineWidth = 1.6; g.beginPath(); g.ellipse(0, 0, 7, 3.4, 0, 0, 7); g.fill(); g.stroke(); g.beginPath(); g.moveTo(-7, 0); g.lineTo(7, 0); g.stroke(); g.restore(); }
    else if (f.k === 'speed') { const a = Math.min(1, f.life / 0.1) * (1 - u); g.strokeStyle = 'rgba(30,30,30,' + (0.5 * a) + ')'; g.lineWidth = 2.2; g.lineCap = 'round'; const dir = Math.sign(f.v); g.beginPath(); g.moveTo(f.x, f.y); g.lineTo(f.x - dir * f.len, f.y); g.stroke(); }
    else if (f.k === 'puff') { const sx = f.wx * SC - cam.x, sy = gy - f.y * SC * 0.7; g.strokeStyle = 'rgba(70,70,70,' + (0.7 * (1 - u)) + ')'; g.fillStyle = 'rgba(255,255,255,' + (0.8 * (1 - u)) + ')'; g.lineWidth = 1.6; g.beginPath(); g.arc(sx, sy, f.r * SC * 0.7 * (1 + u * 1.2), 0, 7); g.fill(); g.stroke(); }
  }
}
// ---- 업데이트 ----
let last = performance.now();
function update(dt) {
  P.t += dt; const run = keys.ShiftLeft || keys.ShiftRight, dirIn = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const maxV = dirIn ? (run ? 330 : 190) : 0, rev = dirIn && Math.sign(P.vx) === -dirIn && Math.abs(P.vx) > 20, acc = P.ground ? (dirIn ? (rev ? 950 : 460) : 330) : (dirIn ? 240 : 40); const dv = maxV * dirIn - P.vx; const sgn = Math.sign(dv); P.vx += sgn * Math.min(Math.abs(dv), acc * dt); P.vx += WIND.g * (P.ground ? 14 : 55) * dt;   // 관성: 천천히 속도가 붙고, 멈출 때도 미끄러진다 (공중에서는 방향을 잘 못 바꾼다)
  P.axT = (P.vx - (P.pvx === undefined ? P.vx : P.pvx)) / Math.max(dt, 1e-3); P.ax += (P.axT - P.ax) * Math.min(1, dt * 10); P.pvx = P.vx;
  if (dirIn) P.dir = dirIn; P.x += P.vx * dt;
  P.coyote = P.ground ? 0.1 : Math.max(0, P.coyote - dt); P.jumpBuf = Math.max(0, P.jumpBuf - dt);
  if (P.jumpBuf > 0 && (P.ground || P.coyote > 0)) { P.vy = -540; P.ground = false; P.coyote = 0; P.jumpBuf = 0; P.squash = -0.6; }
  const grav = P.vy < 0 && (keys.Space || keys.ArrowUp || keys.KeyW) ? 1050 : 1650; P.vy += grav * dt; P.y += P.vy * dt;
  if (P.y >= GROUND_Y) { if (!P.ground && P.vy > 200) { P.squash = Math.min(1, P.vy / 600); P.landFx = 1; } P.y = GROUND_Y; P.vy = 0; P.ground = true; }
  P.squash += (0 - P.squash) * Math.min(1, dt * 12);
  P.gait += dt * Math.abs(P.vx) * GAIT_K; P.nextBlink -= dt; if (P.nextBlink <= 0) { P.blink = 0.12; P.nextBlink = 2 + Math.random() * 3; } P.blink = Math.max(0, P.blink - dt);
  { const tg = -P.vx * 0.0019 + P.vy * 0.0007; P.lv += ((tg - P.la) * 210 - P.lv * 13) * dt; P.la += P.lv * dt; P.la = Math.max(-0.9, Math.min(0.9, P.la)); }
  runK += ((Math.abs(P.vx) > 250 ? 1 : 0) - runK) * Math.min(1, dt * 2.5); SC = SC0 * (1 - 0.1 * runK);
  spawnFx(dt, Math.round(H * 0.76));
  cam.x += ((P.x * SC - W * 0.45 + P.vx * 0.75 * SC / 3) - cam.x) * Math.min(1, dt * 4.2);
}
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop); window.__g = { P, keys, cam };
</script>
</body>
</html>
