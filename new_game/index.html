<style>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="mini" id="sCp">⚑ 체크포인트로 가기</button><button class="mini" id="sRe">처음부터 다시</button><button class="mini" id="sClose" style="margin-left:auto">닫기</button></div></div></div>

<script>
// ===== 새 게임 (1단계, 2D): 평범한 아이 1명 + 땅. 옆에서 보는 횡스크롤 =====
const cv = document.getElementById('c'); let g = cv.getContext('2d');
const SETS = { fx: true, bg: true, names: true, timer: true, zoom: 1 }; try { Object.assign(SETS, JSON.parse(localStorage.getItem('ng_set') || '{}')); } catch (e) {}
let W = 0, H = 0, DPR = 1, SC = 1, SC0 = 1;   // SC: 세계 한 칸(px) 배율
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; SC0 = Math.max(1.2, Math.min(W / 640, H / 360)) * 1.35 * (SETS.zoom || 1); SC = SC0; }
addEventListener('resize', resize); resize();

// ---- 입력 ----
addEventListener('keydown', (e) => { if (e.code === 'F5') e.preventDefault(); });   // F5 새로고침 막기
const keys = {}; addEventListener('keydown', (e) => { if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return; keys[e.code] = true; if (e.code === 'Escape') { if (SETOPEN) setClose(); else toggleMenu(); return; } if (e.code === 'Space' && !e.repeat) P.spT = 0; if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !e.repeat) { P.jumpBuf = 0.12; P.jumpKey = e.code; } });
addEventListener('keyup', (e) => { keys[e.code] = false; if (e.code === 'Space') { if (P.cling && P.spT >= 0 && P.spT < 0.17) P.wjReq = true; P.spT = -1; } }); addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---- 세계: 땅 높이는 y=0, 위쪽이 음수 (캔버스 좌표) ----
const GROUND_Y = 0;
const P = { spT: -1, wjReq: false, freeze: 0, ax: 0, la: 0, lv: 0, x: 0, y: 0, vx: 0, vy: 0, dir: 1, ground: true, coyote: 0, jumpBuf: 0, gait: 0, squash: 0, blink: 0, nextBlink: 2.2, t: 0, landT: 0 };
const cam = { x: 0, y: 0 };

// ---- 그리기 도구 ----
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); };
function limb(x0, y0, x1, y1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }

// ===== 흑백 낙서 스타일 =====
const INK = '#111', PAPER = '#f4f4f2', GAIT_K = 0.09, STRIDE = 1 / GAIT_K;
const wob = (x, k) => Math.sin(x * 0.071 + k) * 1.3 + Math.sin(x * 0.19 + k * 2) * 0.8;   // 손으로 그린 듯한 떨림
function sketchLine(x0, y0, x1, y1, w, col, ox) { ox = ox || 0; g.strokeStyle = col || INK; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); const n = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 14)); for (let k = 0; k <= n; k++) { const u = k / n, px = x0 + (x1 - x0) * u, py = y0 + (y1 - y0) * u + wob(px + ox, 1.7); k ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke(); }

// 캐릭터: 네모 몸통 + 발 2개 (검은 테두리)
// ===== 몸 모양 12가지 (모두 같은 틀 x -20~20, y -38~0 안에 맞춘다) =====
const SHAPE_NAMES = ['네모', '동글네모', '동그라미', '달걀', '삼각형', '마름모', '육각형', '별', '하트', '구름', '유령', '콩'];
const SHAPE_PTS = (() => {
  const fit = (pts) => { let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; pts.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }); return pts.map(([x, y]) => [-20 + (x - x0) / (x1 - x0) * 40, -38 + (y - y0) / (y1 - y0) * 38]); };
  const ellipse = (rx, ry, f, n) => { const o = []; for (let k = 0; k < (n || 48); k++) { const a = k / (n || 48) * Math.PI * 2, r = f ? f(a) : 1; o.push([Math.cos(a) * rx * r, Math.sin(a) * ry * r]); } return o; };
  const rrect = (r) => { const o = []; for (const [cx, cy, a0] of [[20 - r, -38 + r, -90], [20 - r, -r, 0], [-20 + r, -r, 90], [-20 + r, -38 + r, 180]]) for (let k = 0; k <= 6; k++) { const a = (a0 + 90 * k / 6) * Math.PI / 180; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; };
  const star = () => { const o = []; for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 9 : 21; o.push([Math.cos(a) * r, Math.sin(a) * r]); } return o; };
  const heart = () => { const o = []; for (let k = 0; k < 60; k++) { const tt = k / 60 * Math.PI * 2; o.push([16 * Math.pow(Math.sin(tt), 3), -(13 * Math.cos(tt) - 5 * Math.cos(2 * tt) - 2 * Math.cos(3 * tt) - Math.cos(4 * tt))]); } return o; };
  const ghost = () => { const o = []; for (let k = 0; k <= 16; k++) { const a = Math.PI + k / 16 * Math.PI; o.push([Math.cos(a) * 20, -18 + Math.sin(a) * 20]); } for (let k = 0; k <= 12; k++) o.push([20 - k * 40 / 12, k % 2 ? -3 : 1]); return o; };
