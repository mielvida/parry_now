let tAcc = 0;
function render() { updateView(0.016, tAcc); renderer.render(scene, camera); drawHud(); }

// ===== 화면(DOM) =====
function show(id) { for (const k of ['title', 'how', 'pause', 'result', 'shop']) $(k).classList.toggle('on', k === id); }
function langBtn() { return '<button class="btn small" id="bLang">🌐 ' + LNAMES[li()] + '</button>'; }

function rebuild() { if (ST === 'title') showTitle(); else if ($('how').classList.contains('on')) showHow(); else if ($('pause').classList.contains('on')) showPause(); else if ($('result').classList.contains('on')) showResult(); else if ($('shop').classList.contains('on')) showShop(shopFrom); }
function showTitle() {

  show('title'); $('bStart').onclick = () => startLevel(SAVE.sector); $('bHow').onclick = showHow; $('bShop').onclick = () => showShop('title'); bindLang();
}
function showHow() { $('how').innerHTML = '<h2>' + T('how') + '</h2><div class="help">' + ['k1', 'k2', 'k3b', 'k4b', 'k5b', 'k6b', 'k7b'].map((k) => T(k)).join('<br>') + '</div><div class="row"><button class="btn" id="bOk">' + T('start') + '</button><button class="btn small" id="bBk">' + T('home') + '</button>' + langBtn() + '</div>'; show('how'); $('bOk').onclick = () => startLevel(SAVE.sector); $('bBk').onclick = showTitle; bindLang(); }
function togglePause() { if (ST === 'play') { ST = 'pause'; if (vacG) vacG.gain.value = 0; try { document.exitPointerLock(); } catch (e) {} showPause(); } else if (ST === 'pause') { ST = 'play'; show(null); if (!('ontouchstart' in window)) requestLock(); } }

$('bPause').onclick = () => { audInit(); togglePause(); };
// 상점
let shopFrom = 'title';
const SHOPS = [
  { id: 'tool', name: () => T('tool') + ' · ' + T('tool' + Math.min(3, SAVE.tool + 1)), lv: () => SAVE.tool, max: 3, cost: () => TOOLCOST[Math.min(3, SAVE.tool + 1)], buy: () => { SAVE.tool++; } },
  { id: 'bag', name: () => T('u1'), lv: () => up(0), max: 10, cost: () => Math.round(40 * Math.pow(up(0) + 1, 1.35)), buy: () => { SAVE.up[0]++; } },
  { id: 'spd', name: () => T('u4'), lv: () => up(1), max: 5, cost: () => 60 * (up(1) + 1), buy: () => { SAVE.up[1]++; } },
  { id: 'jmp', name: () => T('u3'), lv: () => up(2), max: 5, cost: () => 50 * (up(2) + 1), buy: () => { SAVE.up[2]++; } },
  { id: 'bot', name: () => T('robot'), lv: () => up(3), max: 5, cost: () => 350 * (up(3) + 1), buy: () => { SAVE.up[3]++; if (L && ST !== 'title') addBot(L.bots.length); } },
  { id: 'auto', name: () => T('auto'), lv: () => SAVE.auto, max: 1, cost: () => 200, buy: () => { SAVE.auto = 1; } },
