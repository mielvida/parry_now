<head>

<meta charset="utf-8">
<title>내 3D 연습</title>
<style>html,body{margin:0;overflow:hidden;background:#000}#msg{position:fixed;left:12px;top:10px;color:#fff;font:700 18px 'Malgun Gothic',sans-serif;text-shadow:2px 2px 0 #000}</style>
</head>
<body>
<div id="msg">W A S D : 움직이기 · Space : 점프 · 마우스 드래그 : 보기</div>
<script src="../sea_island/three.min.js"></script>
<script>
// ===== 1단계: 무대 만들기 (장면 · 카메라 · 화면) =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);                      // 하늘 색을 바꿔 보세요 (예: 0x000000 은 검정)
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;                                  // 그림자 켜기
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// ===== 2단계: 빛 =====
scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(30, 50, 20); sun.castShadow = true; scene.add(sun);

// ===== 3단계: 물건 만들기 (모양 + 색 = 물건) =====
function 물건(모양, 색, x, y, z) {
  const m = new THREE.Mesh(모양, new THREE.MeshLambertMaterial({ color: 색 }));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
const 땅 = 물건(new THREE.BoxGeometry(100, 1, 100), 0x66aa55, 0, -0.5, 0);   // 큰 땅
const 나 = 물건(new THREE.BoxGeometry(1, 2, 1), 0xffffff, 0, 1, 0);          // 내 캐릭터 (가로1 세로2)
// 아래 줄을 복사해서 숫자(x, y, z)를 바꾸면 물건이 늘어나요
물건(new THREE.BoxGeometry(2, 2, 2), 0xc08040, 5, 1, -4);                   // 상자
물건(new THREE.SphereGeometry(1.2, 20, 14), 0xff6666, -5, 1.2, -6);         // 공
물건(new THREE.ConeGeometry(1.2, 3, 6), 0x9966ff, 8, 1.5, 6);               // 뾰족한 것
물건(new THREE.CylinderGeometry(0.8, 0.8, 3, 16), 0x44aaff, -8, 1.5, 5);    // 기둥

// ===== 4단계: 움직이기 (키보드) =====
const 키 = {};
addEventListener('keydown', (e) => { 키[e.code] = true; });
addEventListener('keyup', (e) => { 키[e.code] = false; });
let 속도Y = 0, 시점 = 0, 높이각 = 0.5;
addEventListener('mousemove', (e) => { if (e.buttons) { 시점 -= e.movementX * 0.005; 높이각 = Math.max(0.1, Math.min(1.3, 높이각 + e.movementY * 0.005)); } });

// ===== 5단계: 게임 루프 (1초에 60번 반복) =====
function 반복() {
  requestAnimationFrame(반복);
  const 이동 = 0.15;                                                       // 걷는 빠르기를 바꿔 보세요
  if (키.KeyW) { 나.position.x -= Math.sin(시점) * 이동; 나.position.z -= Math.cos(시점) * 이동; }
  if (키.KeyS) { 나.position.x += Math.sin(시점) * 이동; 나.position.z += Math.cos(시점) * 이동; }
  if (키.KeyA) { 나.position.x -= Math.cos(시점) * 이동; 나.position.z += Math.sin(시점) * 이동; }
  if (키.KeyD) { 나.position.x += Math.cos(시점) * 이동; 나.position.z -= Math.sin(시점) * 이동; }
  if (키.Space && 나.position.y <= 1.001) 속도Y = 0.28;                    // 점프 힘
  속도Y -= 0.012; 나.position.y += 속도Y;                                  // 중력
  if (나.position.y < 1) { 나.position.y = 1; 속도Y = 0; }                 // 땅에 닿으면 멈춤
  // 카메라는 내 뒤에서 따라다녀요
  camera.position.set(나.position.x + Math.sin(시점) * 10, 나.position.y + 높이각 * 10, 나.position.z + Math.cos(시점) * 10);
  camera.lookAt(나.position.x, 나.position.y + 1, 나.position.z);
  renderer.render(scene, camera);
}
반복();
</script>
</body>
</html>
