// ===== 화면(DOM) =====
function show(id) { for (const k of ['title', 'how', 'pause', 'result']) $(k).classList.toggle('on', k === id); }

  show('title'); $('bStart').onclick = () => { audInit(); startLevel(SAVE.level); }; $('bHow').onclick = showHow; $('bShop').onclick = () => { showResult(true); }; bindLang();
}
function showHow() { $('how').innerHTML = '<h2>' + T('how') + '</h2><div class="help">' + ['h1', 'h2', 'h3', 'h4', 'h5', 'h6'].map((k) => T(k)).join('<br>') + '</div><div class="row"><button class="btn" id="bOk">' + T('start') + '</button><button class="btn small" id="bBk">' + T('home') + '</button>' + langBtn() + '</div>'; show('how'); $('bOk').onclick = () => { audInit(); startLevel(SAVE.level); }; $('bBk').onclick = showTitle; bindLang(); }

}
