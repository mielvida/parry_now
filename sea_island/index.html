  if (inWater && st.ground) { person.position.y = st.y + Math.sin(t * 3) * 0.02; }
  // 카메라
  const fp = view.dist < 0.9; P_.head.visible = !fp;   // 1인칭에서는 내 머리가 시야를 가리지 않게 숨긴다
  if (fp) { const eye = P_.head.getWorldPosition(new THREE.Vector3()); eye.y += 0.34; if (view.pitch < -1.3) view.pitch = -1.3;
    const dx = -Math.sin(view.yaw) * Math.cos(view.pitch), dy = -Math.sin(view.pitch), dz = -Math.cos(view.yaw) * Math.cos(view.pitch);
    cam.position.set(eye.x + dx * 0.12, eye.y + dy * 0.12, eye.z + dz * 0.12); cam.lookAt(eye.x + dx, eye.y + dy, eye.z + dz); }
  else {
  const tx = st.x, ty = st.y + 1.35, tz = st.z, cd = view.dist, cp = view.pitch, cy = view.yaw;
  let cx2 = tx + Math.sin(cy) * Math.cos(cp) * cd, cz2 = tz + Math.cos(cy) * Math.cos(cp) * cd, cy2 = ty + Math.sin(cp) * cd;
  const gh = groundAt(cx2, cz2) + 0.5; if (cy2 < gh) cy2 = gh; // 땅속으로 들어가지 않게
  const inCrown = (x, y, z) => solids.some((s) => s.cr && Math.hypot(x - s.x, z - s.z) < s.cr && y > s.h + s.cb && y < s.h + s.ct);
  let fcam = 1; for (; fcam > 0.18; fcam -= 0.07) if (!inCrown(tx + (cx2 - tx) * fcam, ty + (cy2 - ty) * fcam, tz + (cz2 - tz) * fcam)) break;   // 나뭇잎 속에 카메라가 들어가면 가까이 당긴다
  cam.position.lerp(new THREE.Vector3(tx + (cx2 - tx) * fcam, ty + (cy2 - ty) * fcam, tz + (cz2 - tz) * fcam), Math.min(1, dt * 20)); cam.lookAt(tx, ty, tz);   // 카메라가 아주 살짝만 늦게 따라온다 (살짝 반동)
  }
  updateGun(dt, fp); updateTesters(dt); fpHold(fp); fpBody(fp);
  if (mouseFire && armed()) fireGun();
  sun.position.set(st.x + SUN_DIR.x * 70, SUN_DIR.y * 70, st.z + SUN_DIR.z * 70); sun.target.position.set(st.x, 0, st.z); sun.target.updateMatrixWorld();
  { const sp = cam.position.clone().addScaledVector(SUN_DIR, 270); sunBall.position.copy(sp); sunGlow.position.copy(sp); sunRays.position.copy(sp); sunRays.material.rotation = t * 0.02;   // 해는 늘 같은 방향 하늘에 있다
    const cd = cam.getWorldDirection(new THREE.Vector3()), facing = Math.max(0, cd.dot(SUN_DIR)), g = Math.pow(facing, 5.5), v = sp.clone().project(cam);   // 해를 바라보면 눈부심이 번진다
    const el = $('glare'); el.style.opacity = (g * 0.95).toFixed(3); el.style.background = `radial-gradient(circle at ${((v.x * 0.5 + 0.5) * 100).toFixed(1)}% ${((-v.y * 0.5 + 0.5) * 100).toFixed(1)}%, rgba(255,246,210,0.95) 0%, rgba(255,226,150,0.55) 18%, rgba(255,210,120,0.18) 45%, rgba(255,210,120,0) 75%)`; }
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('msg').classList.remove('on'); }
  // 가까워지면 안내 말풍선
  if (Math.hypot(st.x - hutAt.x, st.z - hutAt.z) < 7) say('🏠 작은 오두막이에요', 'hut');
  if (st.x > PIER.x0 && st.x < PIER.x1 && Math.abs(st.z - PIER.z) < 1.4) say('⚓ 부두 끝에 배가 있어요', 'pier');
}
function loop() { const dt = Math.min(0.05, clock.getDelta()); update(dt); if (window.__camHook) window.__camHook(); R.render(scene, cam); requestAnimationFrame(loop); }
cam.position.set(st.x + 6, st.y + 4, st.z + 6);
$('load').style.display = 'none'; say('🌴 섬을 걸어 보세요!', 'hi'); loop();
window.__g = { st, view, hmap, keys, PIER, solids, update, taken, RG, testers, fireGun, TOWER, groundAt, GUN, cam, R, scene, P_ };
