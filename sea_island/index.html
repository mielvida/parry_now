// 바다: 일렁이는 물결
const wGeo = new THREE.PlaneGeometry(400, 400, 100, 100); wGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(wGeo, new THREE.MeshStandardMaterial({ color: '#2aa6e0', roughness: 0.18, metalness: 0.1, transparent: true, opacity: 0.8, flatShading: true })); water.position.y = WATER_Y; water.receiveShadow = true; scene.add(water);
const wBase = Float32Array.from(wGeo.attributes.position.array);

// ---------- 섬 꾸미기: 나무·바위·풀·오두막·부두·배 ----------
const solids = []; // 부딪히는 것들 {x,z,r}
const dummy = new THREE.Object3D(), up = new THREE.Vector3(0, 1, 0);
const tmpC = new THREE.Color();
function spots(n, hmin, hmax, minGap, rmax) { const out = []; for (let t = 0; t < n * 40 && out.length < n; t++) { const a = rand() * 6.283, d = Math.sqrt(rand()) * (rmax || 44), x = Math.cos(a) * d * 1.1, z = Math.sin(a) * d, h = hmap(x, z); if (h < hmin || h > hmax) continue; if (out.some((q) => Math.hypot(q.x - x, q.z - z) < minGap)) continue; out.push({ x, z, h }); } return out; }

const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.9, flatShading: true }, o || {}));
{ // 야자수: 휘어진 줄기 + 잎사귀

    for (let k = 0; k < 7; k++) { dummy.position.copy(top); dummy.rotation.set(0, yaw + k * 0.9, 0.0); dummy.scale.setScalar(sc * (0.9 + rand() * 0.3)); dummy.updateMatrix(); leaf.setMatrixAt(i * 7 + k, dummy.matrix); }
    for (let k = 0; k < 2; k++) { dummy.position.set(top.x + (k - 0.5) * 0.3, top.y - 0.25, top.z + 0.1); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(1); dummy.updateMatrix(); nut.setMatrixAt(i * 2 + k, dummy.matrix); }

}

}

const hut = new THREE.Group(); hut.position.set(hutAt.x, hutAt.h, hutAt.z);
{ const wall = new THREE.Mesh(new THREE.BoxGeometry(4.4, 2.6, 3.6), M('#d9b27a')); wall.position.y = 1.3; const roof = new THREE.Mesh(new THREE.ConeGeometry(3.7, 1.9, 4), M('#b8553a')); roof.position.y = 3.5; roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, 0.85);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1, 1.8, 0.1), M('#6a4226')); door.position.set(0, 0.9, 1.82); const win = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.1), M('#bfe9ff', { emissive: '#4a7a9a' })); win.position.set(1.4, 1.6, 1.82);

// 부두와 배

  for (let px = PIER.x0; px < PIER.x1; px += 0.7) { const pl = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.12, 2.2), M(px % 1.4 < 0.7 ? '#a8743c' : '#9a6a38')); pl.position.set(px, PIER.y, PIER.z); pl.castShadow = true; pl.receiveShadow = true; planks.add(pl); }

const boat = new THREE.Group();

const keys = {}; const st = { x: 0, z: 0, y: 0, vy: 0, yaw: 0, ground: true, speed: 0, wade: 0 };
{ // 시작 위치: 해변 가까운 곳

let drag = null;
$('gl').addEventListener('pointerdown', (e) => { drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; $('gl').setPointerCapture(e.pointerId); startSound(); });
$('gl').addEventListener('pointermove', (e) => { if (!drag || drag.id !== e.pointerId) return; view.yaw -= (e.clientX - drag.x) * 0.006; view.pitch = Math.max(0.05, Math.min(1.35, view.pitch + (e.clientY - drag.y) * 0.005)); drag.x = e.clientX; drag.y = e.clientY; });
$('gl').addEventListener('pointerup', () => { drag = null; }); $('gl').addEventListener('pointercancel', () => { drag = null; });
addEventListener('wheel', (e) => { view.dist = Math.max(3, Math.min(16, view.dist + e.deltaY * 0.01)); }, { passive: true });
const joy = { x: 0, y: 0, id: null }, stick = $('stick'), knob = $('knob');
function joyMove(e) { const rc = stick.getBoundingClientRect(), cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2; let dx = e.clientX - cx, dy = e.clientY - cy; const m = Math.hypot(dx, dy), lim = 50; if (m > lim) { dx *= lim / m; dy *= lim / m; } joy.x = dx / lim; joy.y = dy / lim; knob.style.transform = `translate(${dx}px,${dy}px)`; }
stick.addEventListener('pointerdown', (e) => { joy.id = e.pointerId; stick.setPointerCapture(e.pointerId); joyMove(e); startSound(); e.stopPropagation(); });
stick.addEventListener('pointermove', (e) => { if (joy.id === e.pointerId) joyMove(e); });
const joyEnd = (e) => { if (joy.id === e.pointerId) { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; } }; stick.addEventListener('pointerup', joyEnd); stick.addEventListener('pointercancel', joyEnd);
$('jump').addEventListener('pointerdown', (e) => { keys.Space = true; startSound(); e.stopPropagation(); }); $('jump').addEventListener('pointerup', () => { keys.Space = false; });
$('run').addEventListener('pointerdown', (e) => { keys.ShiftLeft = !keys.ShiftLeft; $('run').style.background = keys.ShiftLeft ? '#ffd84acc' : ''; e.stopPropagation(); });
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });

// ---------- 소리: 잔잔한 파도 소리 ----------
const snd = { on: true, ac: null, started: false, gain: null };
const VOL = 0.07;   // 파도 소리는 아주 작게
function startSound() { if (snd.started || !snd.on) { if (snd.ac && snd.ac.state === 'suspended') snd.ac.resume(); return; }
  try { const ac = snd.ac = new (window.AudioContext || window.webkitAudioContext)(); const len = ac.sampleRate * 8, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0); let last = 0, pk = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last; }
    const cf = ac.sampleRate * 1; for (let i = 0; i < cf; i++) { const k = i / cf; d[len - cf + i] = d[len - cf + i] * (1 - k) + d[i] * k; }   // 끝과 처음을 섞어 끊김(틱) 없애기
    for (let i = 0; i < len - cf; i++) pk = Math.max(pk, Math.abs(d[i])); for (let i = 0; i < len; i++) d[i] = d[i] / pk * 0.6;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.loopEnd = (len - cf) / ac.sampleRate;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
    const g = snd.gain = ac.createGain(); g.gain.setValueAtTime(0, ac.currentTime); g.gain.linearRampToValueAtTime(VOL, ac.currentTime + 5);   // 5초에 걸쳐 천천히 들어온다
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.09; lg.gain.value = VOL * 0.35; lfo.connect(lg); lg.connect(g.gain);
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(ac.destination); src.start(); lfo.start(); snd.started = true; } catch (e) {} }
function setSound(on) { snd.on = on; $('mus').textContent = on ? '🔊' : '🔇'; if (!snd.ac) { if (on) startSound(); return; } if (snd.gain) snd.gain.gain.cancelScheduledValues(snd.ac.currentTime), snd.gain.gain.setTargetAtTime(on ? VOL : 0, snd.ac.currentTime, 0.3); if (on && snd.ac.state === 'suspended') snd.ac.resume(); }
$('mus').onclick = () => { if (!snd.started && !snd.on) snd.on = true; else setSound(!snd.on); startSound(); };

// ---------- 움직임 ----------
const clock = new THREE.Clock(); let t = 0, msgT = 0, msgShown = {};
function say(text, key) { if (key && msgShown[key]) return; if (key) msgShown[key] = 1; $('msg').textContent = text; $('msg').classList.add('on'); msgT = 3.2; }
function groundAt(x, z) { let h = hmap(x, z); if (x > PIER.x0 && x < PIER.x1 && Math.abs(z - PIER.z) < 1.1) h = Math.max(h, PIER.y + 0.06); return h; }
function update(dt) {
  t += dt;
  // 입력 방향 (카메라 기준)
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x, iz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + joy.y;
  const mag = Math.min(1, Math.hypot(ix, iz)); let moving = mag > 0.05;
  const run = keys.ShiftLeft || keys.ShiftRight, inWater = hmap(st.x, st.z) < -0.15 && st.y < 0.05;
  const target = moving ? (run ? 7.2 : 3.8) * mag * (inWater ? 0.6 : 1) : 0; st.speed += (target - st.speed) * Math.min(1, dt * 10);
  if (moving) { const il = Math.hypot(ix, iz), nx0 = ix / il, nz0 = iz / il, dirx = Math.sin(view.yaw) * nz0 + Math.cos(view.yaw) * nx0, dirz = Math.cos(view.yaw) * nz0 - Math.sin(view.yaw) * nx0; st.yaw = Math.atan2(dirx, dirz); // 카메라가 보는 방향 기준
    let nx = st.x + dirx * st.speed * dt, nz = st.z + dirz * st.speed * dt;
    if (hmap(nx, nz) < -1.25 && !(nx > PIER.x0 && nx < PIER.x1 && Math.abs(nz - PIER.z) < 1.1)) { // 너무 깊은 바다는 못 간다
      if (hmap(nx, st.z) >= -1.25) nz = st.z; else if (hmap(st.x, nz) >= -1.25) nx = st.x; else { nx = st.x; nz = st.z; say('여기부터는 너무 깊어요 🌊', 'deep'); } }
    for (const s of solids) { const dx = nx - s.x, dz = nz - s.z, d = Math.hypot(dx, dz), m = s.r + 0.3; if (d < m && d > 0.0001) { nx = s.x + dx / d * m; nz = s.z + dz / d * m; } }
    st.x = nx; st.z = nz; }
  // 점프와 중력
  const gy = groundAt(st.x, st.z);
  if (keys.Space && st.ground) { st.vy = 6.2; st.ground = false; }
  st.vy -= 16 * dt; st.y += st.vy * dt; if (st.y <= gy) { st.y = gy; st.vy = 0; st.ground = true; } else if (st.y > gy + 0.05) st.ground = false;
  if (st.ground && gy - st.y < 0.5) st.y = gy;
  // 사람 모델
  person.position.set(st.x, st.y, st.z);
  { let d = st.yaw - person.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); person.rotation.y += d * Math.min(1, dt * 12); }
  const sw = Math.sin(t * (run ? 14 : 9)) * Math.min(1, st.speed / 3.8) * (run ? 0.95 : 0.7);
  P.arms[0].rotation.x = sw; P.arms[1].rotation.x = -sw; P.legs[0].rotation.x = -sw; P.legs[1].rotation.x = sw;
  if (!st.ground) { P.arms[0].rotation.x = P.arms[1].rotation.x = -2.2; P.legs[0].rotation.x = -0.5; P.legs[1].rotation.x = 0.5; }
  person.position.y += st.ground ? Math.abs(sw) * 0.05 : 0;
  // 바다 출렁임 & 구름 & 배
  const pw = water.geometry.attributes.position, camx = Math.round(st.x / 4) * 4, camz = Math.round(st.z / 4) * 4;
  water.position.x = camx; water.position.z = camz;
  for (let i = 0; i < pw.count; i++) { const bx = wBase[i * 3], bz = wBase[i * 3 + 2]; pw.setY(i, wave(bx + camx, bz + camz, t)); }
  pw.needsUpdate = true; water.geometry.computeVertexNormals();
  boat.position.y = wave(boat.position.x, boat.position.z, t) + 0.05; boat.rotation.z = Math.sin(t * 1.3) * 0.05; boat.rotation.x = Math.sin(t * 0.9) * 0.04;
  clouds.forEach((c, k) => { c.position.x += dt * (1.2 + k * 0.05); if (c.position.x > 190) c.position.x = -190; });
  if (inWater && st.ground) { person.position.y = st.y + Math.sin(t * 3) * 0.02; }
  // 카메라
  const tx = st.x, ty = st.y + 1.5, tz = st.z, cd = view.dist, cp = view.pitch, cy = view.yaw;
  let cx2 = tx + Math.sin(cy) * Math.cos(cp) * cd, cz2 = tz + Math.cos(cy) * Math.cos(cp) * cd, cy2 = ty + Math.sin(cp) * cd;
  const gh = groundAt(cx2, cz2) + 0.5; if (cy2 < gh) cy2 = gh; // 땅속으로 들어가지 않게
  cam.position.lerp(new THREE.Vector3(cx2, cy2, cz2), Math.min(1, dt * 12)); cam.lookAt(tx, ty, tz);
  sun.position.set(st.x + 30, 45, st.z + 22); sun.target.position.set(st.x, 0, st.z); sun.target.updateMatrixWorld();
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('msg').classList.remove('on'); }
  // 가까워지면 안내 말풍선
  if (Math.hypot(st.x - hutAt.x, st.z - hutAt.z) < 7) say('🏠 작은 오두막이에요', 'hut');
  if (st.x > PIER.x0 && st.x < PIER.x1 && Math.abs(st.z - PIER.z) < 1.4) say('⚓ 부두 끝에 배가 있어요', 'pier');
}
function loop() { const dt = Math.min(0.05, clock.getDelta()); update(dt); R.render(scene, cam); requestAnimationFrame(loop); }
cam.position.set(st.x + 6, st.y + 4, st.z + 6);
$('load').style.display = 'none'; say('🌴 섬을 걸어 보세요!', 'hi'); loop();
window.__g = { st, view, hmap, keys, PIER, solids };
</script>
